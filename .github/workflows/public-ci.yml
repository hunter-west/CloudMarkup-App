name: Public source CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Public source checks
    if: github.repository == 'hunter-west/CloudMarkup-App'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: "true"
      GOTOOLCHAIN: local
      TURBO_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=4096
      CLOUDMARKUP_TEST_DATABASE_URL: postgresql://cloudmarkup:cloudmarkup-local-only@127.0.0.1:55432/cloudmarkup
    services:
      postgres:
        image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: cloudmarkup
          POSTGRES_USER: cloudmarkup
          POSTGRES_PASSWORD: cloudmarkup-local-only
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U cloudmarkup -d cloudmarkup"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - name: Check out the event commit without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install the workspace-pinned pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          run_install: false

      - name: Set up the pinned Node.js runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Set up the pinned Go compiler
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.26.8
          check-latest: false
          cache: false

      - name: Install frozen public dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and hash the local compiler for backend integration tests
        shell: bash
        run: |
          set -euo pipefail
          compiler="$RUNNER_TEMP/cloudmarkup-test-compiler"
          go -C services/iac-compiler build -trimpath -o "$compiler" ./cmd/cloudmarkup-iac
          compiler_sha="$(sha256sum "$compiler" | cut -d ' ' -f 1)"
          printf 'CLOUDMARKUP_TEST_COMPILER_EXECUTABLE=%s\n' "$compiler" >> "$GITHUB_ENV"
          printf 'CLOUDMARKUP_TEST_COMPILER_SHA256=%s\n' "$compiler_sha" >> "$GITHUB_ENV"

      - name: Build, lint, type-check and test the public source
        run: pnpm check:public

      - name: Verify local setup and standalone operator tooling
        run: pnpm local:test && pnpm test:self-host:tooling

      - name: Install the lock-pinned Chromium runtime
        run: pnpm test:e2e:install --with-deps

      - name:
          Verify existing editor and light/dark authenticated browser journeys
        run:
          pnpm test:e2e && pnpm test:e2e:typed-backend && pnpm
          test:e2e:solution-export

      - name: Retain synthetic networking screenshots on browser failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: public-networking-browser-failures
          path: test-results/editor-networking*/**/*.png
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
