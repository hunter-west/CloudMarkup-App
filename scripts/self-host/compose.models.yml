# Explicit configured-model overlay. The operator supplies a separate retained
# private directory; this source never creates it or includes it in SQL/object
# backup/restore. Preserve its complete original identity and history.
services:
  app:
    volumes:
      - type: bind
        source:
          ${CLOUDMARKUP_PROVIDER_DISPATCH_DIRECTORY:?Supply independent private
          retained dispatch storage}
        target: /data/cloudmarkup-dispatch
        read_only: false
        bind:
          create_host_path: false
  models-history:
    image: ${CLOUDMARKUP_SELF_HOST_IMAGE:-cloudmarkup-self-host:local}
    profiles: [operator]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    entrypoint: [node, scripts/self-host/models-history.mjs]
    command: [provision]
    environment:
      CLOUDMARKUP_PROVIDER_DISPATCH_CONFIGURATION_FILE: /run/secrets/provider_dispatch_configuration
    secrets: [provider_dispatch_configuration]
    volumes:
      - type: bind
        source:
          ${CLOUDMARKUP_PROVIDER_DISPATCH_DIRECTORY:?Supply independent private
          retained dispatch storage}
        target: /data/cloudmarkup-dispatch
        read_only: false
        bind:
          create_host_path: false
secrets:
  provider_dispatch_configuration:
    file:
      ${CLOUDMARKUP_PROVIDER_DISPATCH_CONFIGURATION_SOURCE:?Supply acknowledged
      new-directory configuration}
