packages:
  - "apps/*"
  - "packages/*"
  - "infra/*"

allowBuilds:
  esbuild: true

# Keep host tooling and the lock-pinned Linux ARM64 Lambda rasterizer available.
supportedArchitectures:
  os: [current, linux]
  cpu: [current, arm64]
  libc: [glibc]

